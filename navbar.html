<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .topnav {
            overflow: hidden;
            background-color: darkslategray;
        }
        .topnav a {
            float: left;
            color: violet;
            text-align: center;
            padding: 15px 17px;
            text-decoration: none;
            font-size: 20px;
        }
        .topnav a:hover {
            background-color: azure;
            color: black;
        }
        .topnav a.active {
            background-color: lightpink;
            color: black;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">About_Us</a>
        <a href="#">Gallery</a>
        <a href="#">Contact_Us</a>
    </div>
</body>
</html>
