<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title> Roll the Dice
    </title>
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to bottom left, purple, violet, pink);
            text-align: center;
            justify-content: center;
            height: 100vh;
        }
        #dice{
            font-size: 100px;
            cursor: pointer;
            text-shadow: 0 0 20px black;
        }
        .shake{
            animation: bounce 0.2s infinite;
        }

        @keyframes bounce{
            0%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-15px);
            }
            100%{
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>🎲 Roll the Dice!</h1>

        <p>Click the dice to roll it!</p>

        <div id="dice"></div>
    </div>

    <script>

        var dices = [
                "&#9856;",
                "&#9857;",
                "&#9858;",
                "&#9859;",
                "&#9860;",
                "&#9861;"
            ];

            var dice = document.getElementById("dice");
            var timer;

            function changeDice(){
                var random = Math.floor(Math.random() * 6);
                dice.innerHTML = dices[random];
            }

            function rollDice(){

                clearInterval(timer);

                dice.classList.add("shake");

                timer = setInterval(changeDice,100);

                setTimeout(function(){

                    clearInterval(timer);

                    dice.classList.remove("shake");

                    changeDice();  //Final random number
                },1500);
            }

            //Roll when the dice is clicked
            dice.onclick = rollDice;

            // show a random dice when the page loads
            changeDice();
        </script>
</body>
</html>
